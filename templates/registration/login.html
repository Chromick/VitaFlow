{% extends "base.html" %}

{% block content %}
<section class="content-grid" style="grid-template-columns: 1fr; max-width: 480px; margin: 40px auto;">
  <div class="panel form-panel">
    <div class="section-heading" style="text-align: center; margin-bottom: 24px;">
      <h2>Acesso ao Sistema</h2>
      <p style="color: var(--muted); margin-top: 8px;">Entre com suas credenciais para gerenciar a clínica.</p>
    </div>

    <form method="post" class="form-grid" style="grid-template-columns: 1fr;">
      {% csrf_token %}
      
      {% if form.errors %}
      <div class="message danger" style="background: #ffe5e5; border-color: #ffcccc; color: var(--danger); margin-bottom: 16px;">
        Nome de usuário ou senha incorretos. Tente novamente.
      </div>
      {% endif %}

      <label class="field">
        <span>Usuário</span>
        <input type="text" name="username" class="form-control" autofocus required>
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" name="password" class="form-control" required>
      </label>

      <div class="form-actions" style="margin-top: 32px;">
        <button type="submit" class="button button-primary" style="width: 100%;">Entrar</button>
      </div>
    </form>

    <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 0.9rem;">
      <p><strong>Acesso de teste:</strong></p>
      <p>Usuário: <code>admin</code> | Senha: <code>admin123</code></p>
    </div>
  </div>
</section>
{% endblock %}
