databases:
  - name: vitaflow-db
    databaseName: vitaflow
    user: vitaflow_user
    plan: free # Use o plano grátis (free) para começar

services:
  - type: web
    name: vitaflow-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn vitaflow.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vitaflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
